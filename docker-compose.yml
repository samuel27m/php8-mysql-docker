version: "3"

services:
    app:
        build:
            context: ./.docker/app
            dockerfile: Dockerfile
        links:
            - db
        ports:
            - "8080:80"
        volumes:
            - ./src:/var/www/html
    db:
        image: mysql:latest
        restart: always
        environment:
            MYSQL_DATABASE: "db"
            MYSQL_USER: "user"
            MYSQL_PASSWORD: "secret"
            MYSQL_ROOT_PASSWORD: "secret"
        ports:
            - "3306:3306"
        volumes:
            - db-data:/var/lib/mysql
volumes:
    db-data:
